[project]
name = "personal-expense-intelligence-agent"
version = "0.1.0"
description = "An AI agent that extracts structured data from receipts and invoices and answers natural-language questions about personal spending using RAG and structured queries."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "logfire>=5.1.1",
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
